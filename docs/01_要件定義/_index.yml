version: 2
project_name: "premake"
phase: 1
overview: "病院内の空きスペース・空き病室を、アートメイク施術を行う看護師がスポット利用できるようにする予約マッチングプラットフォーム（Web 先行・手数料モデル・将来モバイル対応）"
status: in_progress  # PHASE 0-3 完了、PHASE 4 進行中

users:
  - id: U-01
    title: 施術看護師
    type: human
    auth_required: true
  - id: U-02
    title: 施設管理者
    type: human
    auth_required: true
    tenant_scoped: true
  - id: U-03
    title: 指示医
    type: human
    auth_required: true
    tenant_scoped: true
    capabilities: [electronic_signature]
  - id: U-04
    title: 運営
    type: human
    auth_required: true
    capabilities: [audit, refund, kyc_review, managed_onboarding]
  - id: U-05
    title: 利用客（被施術者）
    type: guest
    auth_required: false
    note: "ゲスト予約。メール + 電話番号 + SMS 認証のみ（DEC-12）"
  - id: U-06
    title: 法人管理者
    type: human
    auth_required: true
    org_scoped: true
    capabilities: [manage_facilities, invite_admin_doctor, org_dashboard]
    note: "多店舗を持つ医療法人の本部管理者（DEC-16）"
  - id: U-AI
    title: AI Coding Agent
    type: agent

